spring.application.name=collaboration

server.port=8080

# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/creative_collaboration_network
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# MEGA CONFIGURATION
# ===============================

mega.remote-root=/creative-collaboration/posts
mega.command-path=${LOCALAPPDATA}/MEGAcmd

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=${JWT_SECRET:creative-collaboration-network-development-secret-key-2026}
jwt.expiration=3600000