spring.application.name=collaboration

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/creative_collaboration
spring.datasource.username=root
spring.datasource.password=YOUR_NEW_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

mega.remote-root=/creative-collaboration/posts
mega.command-path=${LOCALAPPDATA}/MEGAcmd

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB